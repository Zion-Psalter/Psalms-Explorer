name: Sync sheet data

on:
  schedule:
    # Hourly. GitHub doesn't guarantee scheduled workflows run at the exact
    # minute (more delay during platform-wide high load) — that only affects
    # how fresh data.json is by a few minutes, never breaks anything.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data.json from the Google Sheet
        run: node scripts/sync-sheet.mjs

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Sync song data from Google Sheet"
            git push
          fi
